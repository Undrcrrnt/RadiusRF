name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
        run: echo "$RELEASE_STORE_FILE_BASE64" | base64 -d > release.jks

      - name: Verify decoded keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore release.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Decoded release.jks is not a valid keystore, or RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS don't match it. The RELEASE_STORE_FILE_BASE64 secret is likely corrupted or stale -- regenerate it with 'base64 -w0 release.jks' and re-upload with 'gh secret set RELEASE_STORE_FILE_BASE64 < release.jks.base64'."
            exit 1
          fi

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Remove decoded keystore
        if: always()
        run: rm -f release.jks

      - name: Rename APK with version tag
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/release/app-release.apk "release-out/RadiusRF-${{ github.ref_name }}-release.apk"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/RadiusRF-${{ github.ref_name }}-release.apk
